# Tailscale identity is trusted only on port 81, which compose publishes to 127.0.0.1 for
# `tailscale serve` alone. `tailscale serve` overwrites these headers with the real user,
# but anything reaching port 80 directly (an SSH tunnel, a process on this machine) could
# send its own; nginx drops them there because an empty proxy_set_header value removes
# the header.
map $server_port $tailscale_login {
    81 $http_tailscale_user_login;
    default "";
}
map $server_port $tailscale_name {
    81 $http_tailscale_user_name;
    default "";
}
map $server_port $tailscale_profile_pic {
    81 $http_tailscale_user_profile_pic;
    default "";
}

server {
    listen 80;
    listen 81;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API responses are JSON or CSV and can be hundreds of KB; text compresses ~10x.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/csv application/javascript text/css image/svg+xml;

    # Resolve the api service through Docker's DNS on every request (cached 10s) instead of
    # once at startup, so recreating only the api container does not leave nginx pointing
    # at its old IP. A variable in proxy_pass is what makes nginx re-resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        # With a variable and no URI part, nginx passes the original request URI through.
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Tailscale-User-Login $tailscale_login;
        proxy_set_header Tailscale-User-Name $tailscale_name;
        proxy_set_header Tailscale-User-Profile-Pic $tailscale_profile_pic;
    }

    location = /healthz {
        proxy_pass $api/healthz;
    }

    location = /readyz {
        proxy_pass $api/readyz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
